<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>O Portal — Protótipo de App de Notícias</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800;900&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F8FAFC;
    --surface:#FFFFFF;
    --ink:#0F172A;
    --ink-2:#334155;
    --ink-3:#64748B;
    --line:#E2E8F0;
    --red:#E11D48;
    --chip:#F1F5F9;
    --ad:#FBFCFE;
  }
  .theme-dark{
    --bg:#0B1120;
    --surface:#121C2E;
    --ink:#F1F5F9;
    --ink-2:#CBD5E1;
    --ink-3:#94A3B8;
    --line:#1E293B;
    --red:#FB7185;
    --chip:#1E293B;
    --ad:#0E1729;
  }
  *{-webkit-tap-highlight-color:transparent}
  body{
    margin:0;
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    background:#111827;
    background-image:radial-gradient(circle at 50% 0%,#1F2937,#0B1120 70%);
    font-family:'Libre Franklin',system-ui,sans-serif;
  }
  /* ---------- moldura ---------- */
  .phone{
    width:375px;height:750px;
    background:#000;
    border-radius:44px;
    padding:10px;
    box-shadow:0 40px 90px rgba(0,0,0,.6), 0 0 0 2px #23262e;
    position:relative;
  }
  .screen{
    width:100%;height:100%;
    border-radius:36px;
    overflow:hidden;
    position:relative;
    background:var(--bg);
    color:var(--ink);
    display:flex;flex-direction:column;
    transition:background .25s ease,color .25s ease;
  }
  .notch{
    position:absolute;top:10px;left:50%;transform:translateX(-50%);
    width:132px;height:26px;background:#000;border-radius:0 0 16px 16px;z-index:60;
  }
  .statusbar{
    height:40px;flex:0 0 40px;display:flex;align-items:flex-end;justify-content:space-between;
    padding:0 22px 6px;font-size:12px;font-weight:700;letter-spacing:.2px;color:var(--ink);
  }
  /* ---------- scroll ---------- */
  .scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .scroll::-webkit-scrollbar{display:none}
  .hscroll{overflow-x:auto;scrollbar-width:none}
  .hscroll::-webkit-scrollbar{display:none}

  /* ---------- ticker ---------- */
  .ticker{background:var(--red);color:#fff}
  .theme-dark .ticker{background:#9F1239;color:#FFE4E6}
  .pulse{animation:pulse 1.05s infinite}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.25;transform:scale(.7)}}
  .marquee{display:inline-block;white-space:nowrap;padding-left:100%;animation:marquee 16s linear infinite}
  @keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}

  /* ---------- pílulas ---------- */
  .pill{
    flex:0 0 auto;padding:7px 15px;border-radius:999px;font-size:13px;font-weight:600;
    background:var(--chip);color:var(--ink-3);border:1px solid transparent;transition:.18s;
  }
  .pill.active{background:var(--ink);color:var(--bg)}
  .theme-dark .pill.active{background:#F1F5F9;color:#0B1120}

  /* ---------- cards ---------- */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;transition:.2s}
  .card:active{transform:scale(.985)}
  .tag{font-size:10px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--red)}
  .thumb{background-size:cover;background-position:center;position:relative;overflow:hidden}
  .grain::after{
    content:"";position:absolute;inset:0;
    background-image:linear-gradient(45deg,rgba(255,255,255,.10) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.10) 50%,rgba(255,255,255,.10) 75%,transparent 75%);
    background-size:10px 10px;opacity:.5;
  }
  .fade-in{animation:fade .28s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* ---------- publicidade ---------- */
  .adwrap{background:var(--ad);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .adlabel{
    font-size:9px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;
    color:var(--ink-3);display:inline-flex;align-items:center;gap:5px;
  }
  .adlabel::before{content:"";width:12px;height:1px;background:var(--ink-3);opacity:.5}
  .adrule{height:1px;background:var(--line)}

  /* ---------- bottom nav ---------- */
  .navbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 2px;color:var(--ink-3);font-size:10px;font-weight:600}
  .navbtn.active{color:var(--red)}
  .navbtn.active .dot{opacity:1}
  .dot{width:4px;height:4px;border-radius:50%;background:var(--red);opacity:0}

  /* ---------- leitor ---------- */
  .reader{
    position:absolute;inset:0;z-index:70;background:var(--bg);
    display:flex;flex-direction:column;
    transform:translateY(100%);transition:transform .34s cubic-bezier(.32,.72,0,1);
  }
  .reader.open{transform:translateY(0)}
  .article-body{font-family:'Source Serif 4',Georgia,serif;color:var(--ink-2);line-height:1.72}
  .article-body p{margin:0 0 16px}
  .article-body h3{font-family:'Libre Franklin',sans-serif;font-weight:800;color:var(--ink);font-size:16px;margin:24px 0 10px}
  .article-body blockquote{
    margin:22px 0;padding:2px 0 2px 16px;border-left:3px solid var(--red);
    font-weight:600;font-style:italic;color:var(--ink);
  }
  /* ---------- toast ---------- */
  .toast{
    position:absolute;left:50%;bottom:26px;transform:translate(-50%,20px);
    background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;
    font-size:12.5px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:90;white-space:nowrap;
  }
  .theme-dark .toast{background:#F1F5F9;color:#0B1120}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .switch{width:42px;height:24px;border-radius:999px;background:var(--line);position:relative;transition:.2s;flex:0 0 auto}
  .switch.on{background:var(--red)}
  .switch i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
  .switch.on i{left:21px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="phone">
  <div class="notch"></div>
  <div class="screen" id="screen">

    <!-- STATUS BAR -->
    <div class="statusbar">
      <span id="clock">09:41</span>
      <span class="flex items-center gap-1.5">
        <svg width="16" height="11" viewBox="0 0 16 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.3" y="5" width="3" height="6" rx="1"/><rect x="8.6" y="2.5" width="3" height="8.5" rx="1"/><rect x="12.9" y="0" width="3" height="11" rx="1" opacity=".35"/></svg>
        <svg width="15" height="11" viewBox="0 0 15 11" fill="currentColor"><path d="M7.5 10.5 5 7.8a3.6 3.6 0 0 1 5 0l-2.5 2.7ZM2.6 5.4 .5 3.2a10 10 0 0 1 14 0l-2.1 2.2a7 7 0 0 0-9.8 0Z"/></svg>
        <svg width="24" height="12" viewBox="0 0 24 12" fill="none"><rect x=".6" y=".6" width="19" height="10.8" rx="3" stroke="currentColor" opacity=".4"/><rect x="2.4" y="2.4" width="13" height="7.2" rx="1.6" fill="currentColor"/><path d="M21.4 4.2v3.6a2 2 0 0 0 0-3.6Z" fill="currentColor" opacity=".4"/></svg>
      </span>
    </div>

    <!-- HEADER -->
    <header class="px-4 pb-2.5 flex items-center justify-between" style="background:var(--bg)">
      <div class="flex items-baseline gap-1.5">
        <span class="text-[21px] font-black tracking-tight" style="color:var(--ink)">O Portal</span>
        <span class="w-1.5 h-1.5 rounded-full block" style="background:var(--red)"></span>
      </div>
      <div class="flex items-center gap-0.5">
        <button onclick="toast('Busca em breve neste protótipo')" class="w-9 h-9 rounded-full flex items-center justify-center" style="color:var(--ink)">

        </button>
        <button id="hdrSaved" onclick="openSaved()" class="w-9 h-9 rounded-full flex items-center justify-center relative" style="color:var(--ink)"></button>
        <button onclick="toast('3 novas notificações')" class="w-9 h-9 rounded-full flex items-center justify-center relative" style="color:var(--ink)">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          <span class="absolute top-1.5 right-1.5 w-2 h-2 rounded-full border-2" style="background:var(--red);border-color:var(--bg)"></span>
        </button>
      </div>
    </header>

    <!-- TICKER AO VIVO -->
    <div class="ticker flex items-center h-8 flex-none" id="ticker">
      <div class="flex items-center gap-1.5 px-3.5 h-full flex-none">
        <span class="w-1.5 h-1.5 rounded-full bg-white pulse block"></span>
        <span class="text-[10px] font-black tracking-[1.5px]">AO VIVO</span>
      </div>
      <div class="h-4 w-px bg-white/30 flex-none"></div>
      <div class="overflow-hidden flex-1">
        <div class="marquee text-[11.5px] font-medium">Copom mantém a Selic em 10,25% ao ano  •  Ministério anuncia pacote de R$ 12 bi para infraestrutura  •  Bolsa fecha em alta de 1,8% puxada por commodities  •  Frente fria chega ao Sudeste nesta quinta</div>
      </div>
    </div>

    <!-- CATEGORIAS -->
    <nav class="hscroll flex gap-2 px-4 py-3 flex-none" id="cats" style="background:var(--bg)"></nav>

    <!-- CONTEÚDO -->
    <main class="scroll" id="main"></main>

    <!-- BOTTOM NAV -->
    <nav class="flex-none flex items-stretch border-t px-1 pb-2" style="border-color:var(--line);background:var(--surface)" id="tabs"></nav>

    <!-- LEITOR -->
    <section class="reader" id="reader">
      <div class="statusbar"><span id="clock2">09:41</span><span class="text-[10px] font-bold tracking-widest" style="color:var(--ink-3)">LEITURA</span></div>
      <div class="px-3 pb-2 flex items-center justify-between flex-none">
        <button onclick="closeReader()" class="w-9 h-9 rounded-full flex items-center justify-center" style="background:var(--chip);color:var(--ink)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18 9 12l6-6"/></svg>
        </button>
        <div class="flex items-center gap-1.5">
          <button onclick="fontStep(-1)" class="h-9 px-3 rounded-full text-[13px] font-bold" style="background:var(--chip);color:var(--ink)">A−</button>
          <button onclick="fontStep(1)" class="h-9 px-3 rounded-full text-[15px] font-bold" style="background:var(--chip);color:var(--ink)">A+</button>
          <button id="rBookmark" onclick="toggleSaveCurrent()" class="w-9 h-9 rounded-full flex items-center justify-center" style="background:var(--chip);color:var(--ink)"></button>
          <button onclick="share()" class="w-9 h-9 rounded-full flex items-center justify-center" style="background:var(--chip);color:var(--ink)">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13"/><path d="m7.5 7.5 4.5-4.5 4.5 4.5"/><path d="M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg>
          </button>
        </div>
      </div>
      <div class="scroll px-5 pb-8" id="readerBody"></div>
    </section>

    <div class="toast" id="toast"></div>
  </div>
</div>

const S = { tab:'feed', cat:'Início', salvos:[], curtidos:[], atual:null, fonte:16, dark:false, audio:false, prog:0, timer:null };

/* ====================== HELPERS ====================== */
const $ = id => document.getElementById(id);
const art = id => ARTIGOS.find(a=>a.id===id);
const porCat = c => ARTIGOS.filter(a=>a.cat===c);
const CATS = ['Início'].concat(EDITORIAS.map(e=>e.nome));
let toastT;
function toast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1700);
}

/* ====================== BARRAS DE NAVEGAÇÃO ====================== */
function renderCats(){
  $('cats').innerHTML = CATS.map(c=>
    `<button class="pill ${S.cat===c?'active':''}" onclick="setCat('${c}')">${c}</button>`).join('');
}
function setCat(c){
  S.cat=c; S.tab='feed';
  renderCats(); renderTabs(); renderMain(); $('main').scrollTop=0;
  const ativo = $('cats').querySelector('.pill.active');
  if(ativo) ativo.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
}

function renderTabs(){
  $('tabs').innerHTML = TABS.map(t=>{
    const a = S.tab===t.k || (S.tab==='saved' && t.k==='user');
    return `<button class="navbtn ${a?'active':''} relative" onclick="setTab('${t.k}')">${ic[t.i](a)}<span>${t.l}</span><span class="dot"></span></button>`;
  }).join('');
}
function setTab(k){ S.tab=k; renderTabs(); renderMain(); $('main').scrollTop=0; }

function renderHeaderSaved(){
  const n = S.salvos.length;
  $('hdrSaved').innerHTML = ic.bookmark(n>0,19) +
    (n ? `<span class="absolute top-1 right-1 min-w-[15px] h-[15px] px-1 rounded-full text-[9px] font-bold text-white flex items-center justify-center border-2" style="background:var(--red);border-color:var(--bg)">${n}</span>` : '');
  $('hdrSaved').style.color = n ? 'var(--red)' : 'var(--ink)';
}
function openSaved(){ S.tab='saved'; renderTabs(); renderMain(); $('main').scrollTop=0; }

/* ====================== CONTEÚDO ====================== */
function renderMain(){
  const m = $('main');
  $('cats').style.display   = S.tab==='feed' ? 'flex' : 'none';
  $('ticker').style.display = S.tab==='feed' ? 'flex' : 'none';
  m.innerHTML = { feed:viewFeed, editorias:viewEditorias, video:viewVideos, saved:viewSaved, user:viewPerfil }[S.tab]();
  if(m.firstElementChild) m.firstElementChild.classList.add('fade-in');
  renderHeaderSaved();
}

  const hero = lista[0], resto = lista.slice(1);
  const meio = Math.min(3, resto.length);
  const on = S.salvos.includes(hero.id);
  return `
  <div class="px-4 pb-4">
    ${adBanner()}

    <article class="card overflow-hidden mb-5" onclick="openReader('${hero.id}')">
      <div class="thumb grain h-[176px] relative" style="background-image:${hero.g}">
        <span class="absolute top-3 left-3 text-[9.5px] font-black tracking-[1.4px] text-white px-2.5 py-1 rounded-md" style="background:var(--red)">${hero.tag.toUpperCase()}</span>
        <button onclick="event.stopPropagation();toggleSave('${hero.id}')" class="absolute top-2.5 right-3 w-8 h-8 rounded-full bg-black/35 backdrop-blur flex items-center justify-center text-white">${ic.bookmark(on)}</button>
      </div>
      <div class="p-4">
        <span class="tag">${hero.cat}</span>
        <h2 class="text-[21px] font-black leading-[1.15] tracking-tight mt-1.5 mb-2" style="color:var(--ink)">${hero.titulo}</h2>
        <p class="text-[13px] leading-snug mb-3" style="color:var(--ink-2)">${hero.dek}</p>
        <div class="flex items-center gap-3 text-[11px] font-semibold" style="color:var(--ink-3)">
          <span class="flex items-center gap-1">${ic.clock}${hero.tempo}</span>
          <span class="flex items-center gap-1">${ic.book}${hero.leitura} de leitura</span>
        </div>
      </div>
    </article>

    <div class="flex items-center justify-between mb-3">
      <h4 class="text-[12px] font-black tracking-[1.6px]" style="color:var(--ink)">${S.cat==='Início'?'MAIS NOTÍCIAS':S.cat.toUpperCase()}</h4>
      <span class="text-[11px] font-semibold" style="color:var(--ink-3)">${resto.length} ${resto.length===1?'matéria':'matérias'}</span>
    </div>

    ${resto.slice(0,meio).map(cardMini).join('')}
    ${resto.length>meio ? adOfertas() : ''}
    ${resto.slice(meio).map(cardMini).join('')}

    <p class="text-center text-[11px] py-4" style="color:var(--ink-3)">Você chegou ao fim das notícias de agora</p>
  </div>`;
}

function linha(label,valor,acao){

        <span class="text-[9.5px] font-black tracking-[1.5px] text-white/70">ASSINATURA DIGITAL</span>

/* ====================== AÇÕES ====================== */
function toggleSave(id){
  const i = S.salvos.indexOf(id);
  if(i>-1){ S.salvos.splice(i,1); toast('Removido da sua lista'); }
  else { S.salvos.unshift(id); toast('Salvo na sua lista'); }
  renderMain(); syncReaderBookmark();
}
function toggleSaveCurrent(){ if(S.atual) toggleSave(S.atual); }
function like(i){
  const p = S.curtidos.indexOf(i);
  if(p>-1){ S.curtidos.splice(p,1); } else { S.curtidos.push(i); }
  renderMain();
}
function share(){ toast('Link copiado para compartilhar'); }
function toggleTheme(){
  S.dark = !S.dark;
  $('screen').classList.toggle('theme-dark', S.dark);
  renderMain();
  toast(S.dark ? 'Tema escuro ativado' : 'Tema claro ativado');
}

/* ====================== LEITOR ====================== */
function openReader(id){
  const a = art(id); if(!a) return;
  S.atual = id; S.fonte = 16; S.prog = 0; stopAudio();

  const blocos = a.corpo.map(b => b.t==='h' ? `<h3>${b.c}</h3>` : b.t==='q' ? `<blockquote>${b.c}</blockquote>` : `<p>${b.c}</p>`);
  const corte = Math.min(3, blocos.length);
  const corpoHTML = blocos.slice(0,corte).join('') + adLeitor() + blocos.slice(corte).join('');

  $('readerBody').innerHTML = `
    <span class="tag">${a.cat} · ${a.tag}</span>
    <h1 class="text-[24px] font-black leading-[1.12] tracking-tight mt-1.5 mb-2.5" style="color:var(--ink)">${a.titulo}</h1>
    <p class="text-[14px] leading-snug font-medium mb-4" style="color:var(--ink-2)">${a.dek}</p>
    <div class="flex items-center gap-2.5 pb-4 mb-4 border-b" style="border-color:var(--line)">
      <div class="w-9 h-9 rounded-full flex items-center justify-center text-[12px] font-black text-white" style="background:${a.g}">${a.autor.split(' ').map(n=>n[0]).join('')}</div>
      <div class="leading-tight">
        <p class="text-[12.5px] font-bold" style="color:var(--ink)">${a.autor}</p>
        <p class="text-[11px]" style="color:var(--ink-3)">${a.local} · ${a.tempo} · ${a.leitura} de leitura</p>
      </div>
    </div>

    <div class="card p-3 flex items-center gap-3 mb-5">
      <button id="audioBtn" onclick="toggleAudio()" class="w-10 h-10 rounded-full flex items-center justify-center text-white flex-none" style="background:var(--red)">${ic.play}</button>
      <div class="flex-1 min-w-0">
        <p class="text-[12px] font-bold mb-1.5" style="color:var(--ink)">Ouvir a matéria narrada</p>
        <div class="h-1 rounded-full w-full" style="background:var(--line)"><div id="audioBar" class="h-1 rounded-full" style="width:0%;background:var(--red)"></div></div>
      </div>
      <span id="audioTime" class="text-[11px] font-semibold tabular-nums flex-none" style="color:var(--ink-3)">0:00</span>
    </div>

    <div class="thumb grain h-[160px] rounded-xl mb-1.5" style="background-image:${a.g}"></div>
    <p class="text-[10.5px] mb-5" style="color:var(--ink-3)">Registro feito nesta terça-feira · Foto: Agência O Portal</p>

    <div class="article-body" id="corpo" style="font-size:16px">${corpoHTML}</div>

    <div class="flex gap-2 mt-6">
      <button onclick="share()" class="flex-1 py-3 rounded-xl text-[13px] font-bold text-white" style="background:var(--ink)">Compartilhar matéria</button>
      <button onclick="toggleSaveCurrent()" class="px-4 py-3 rounded-xl text-[13px] font-bold" style="background:var(--chip);color:var(--ink)">Salvar</button>
    </div>
  `;
  syncReaderBookmark();
  $('reader').classList.add('open');
  $('reader').querySelector('.scroll').scrollTop = 0;
}
function closeReader(){ stopAudio(); $('reader').classList.remove('open'); S.atual=null; }
function syncReaderBookmark(){
  const b = $('rBookmark'); if(!b) return;
  const on = S.atual && S.salvos.includes(S.atual);
  b.innerHTML = ic.bookmark(on);
  b.style.color = on ? 'var(--red)' : 'var(--ink)';
}
function fontStep(d){
  S.fonte = Math.min(22, Math.max(13, S.fonte + d*1.5));
  const c = $('corpo'); if(c) c.style.fontSize = S.fonte+'px';
  toast('Fonte em '+Math.round(S.fonte)+' px');
}

/* ---- áudio simulado ---- */
function toggleAudio(){ if(S.audio){ stopAudio(); } else { startAudio(); } }
function startAudio(){
  S.audio = true; $('audioBtn').innerHTML = ic.pause;
  toast('Narração iniciada');
  S.timer = setInterval(()=>{
    S.prog += 0.6;
    if(S.prog >= 100){ S.prog = 0; stopAudio(); return; }
    const bar = $('audioBar'); if(!bar){ stopAudio(); return; }
    bar.style.width = S.prog+'%';
    const seg = Math.floor(S.prog*2.7);
    $('audioTime').textContent = Math.floor(seg/60)+':'+String(seg%60).padStart(2,'0');
  }, 90);
}
function stopAudio(){
  S.audio = false; clearInterval(S.timer);
  const b = $('audioBtn'); if(b) b.innerHTML = ic.play;
}

/* ====================== RELÓGIO + BOOT ====================== */
function tick(){
  const d = new Date();
  const h = String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  $('clock').textContent = h; $('clock2').textContent = h;
}
setInterval(tick, 15000); tick();
renderCats(); renderTabs(); renderMain();
</script>
</body>
</html>
