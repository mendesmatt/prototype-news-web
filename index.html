<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>O Portal — Protótipo de App de Notícias</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800;900&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="phone">
  <div class="notch"></div>
  <div class="screen" id="screen">

    <div class="statusbar">
      <span id="clock">09:41</span>
      <span class="flex items-center gap-1.5">
        <svg width="16" height="11" viewBox="0 0 16 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.3" y="5" width="3" height="6" rx="1"/><rect x="8.6" y="2.5" width="3" height="8.5" rx="1"/><rect x="12.9" y="0" width="3" height="11" rx="1" opacity=".35"/></svg>
        <svg width="15" height="11" viewBox="0 0 15 11" fill="currentColor"><path d="M7.5 10.5 5 7.8a3.6 3.6 0 0 1 5 0l-2.5 2.7ZM2.6 5.4 .5 3.2a10 10 0 0 1 14 0l-2.1 2.2a7 7 0 0 0-9.8 0Z"/></svg>
        <svg width="24" height="12" viewBox="0 0 24 12" fill="none"><rect x=".6" y=".6" width="19" height="10.8" rx="3" stroke="currentColor" opacity=".4"/><rect x="2.4" y="2.4" width="13" height="7.2" rx="1.6" fill="currentColor"/><path d="M21.4 4.2v3.6a2 2 0 0 0 0-3.6Z" fill="currentColor" opacity=".4"/></svg>
      </span>
    </div>

    <header class="px-4 pb-2.5 flex items-center justify-between" style="background:var(--bg)">
      <div class="flex items-baseline gap-1.5">
        <span class="text-[21px] font-black tracking-tight" style="color:var(--ink)">O Portal</span>
        <span class="w-1.5 h-1.5 rounded-full block" style="background:var(--red)"></span>
      </div>
      <div class="flex items-center gap-0.5">
        <button onclick="toast('Busca em breve neste protótipo')" class="w-9 h-9 rounded-full flex items-center justify-center" style="color:var(--ink)">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        </button>
        <button id="hdrSaved" onclick="openSaved()" class="w-9 h-9 rounded-full flex items-center justify-center relative" style="color:var(--ink)"></button>
        <button onclick="toast('3 novas notificações')" class="w-9 h-9 rounded-full flex items-center justify-center relative" style="color:var(--ink)">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          <span class="absolute top-1.5 right-1.5 w-2 h-2 rounded-full border-2" style="background:var(--red);border-color:var(--bg)"></span>
        </button>
      </div>
    </header>

    <div class="ticker flex items-center h-8 flex-none" id="ticker">
      <div class="flex items-center gap-1.5 px-3.5 h-full flex-none">
        <span class="w-1.5 h-1.5 rounded-full bg-white pulse block"></span>
        <span class="text-[10px] font-black tracking-[1.5px]">AO VIVO</span>
      </div>
      <div class="h-4 w-px bg-white/30 flex-none"></div>
      <div class="overflow-hidden flex-1">
        <div class="marquee text-[11.5px] font-medium">Copom mantém a Selic em 10,25% ao ano  •  Ministério anuncia pacote de R$ 12 bi para infraestrutura  •  Bolsa fecha em alta de 1,8% puxada por commodities  •  Frente fria chega ao Sudeste nesta quinta</div>
      </div>
    </div>

    <nav class="hscroll flex gap-2 px-4 py-3 flex-none" id="cats" style="background:var(--bg)"></nav>

    <main class="scroll" id="main"></main>

    <nav class="flex-none flex items-stretch border-t px-1 pb-2" style="border-color:var(--line);background:var(--surface)" id="tabs"></nav>

    <section class="reader" id="reader">
      <div class="statusbar"><span id="clock2">09:41</span><span class="text-[10px] font-bold tracking-widest" style="color:var(--ink-3)">LEITURA</span></div>
      <div class="px-3 pb-2 flex items-center justify-between flex-none">
        <button onclick="closeReader()" class="w-9 h-9 rounded-full flex items-center justify-center" style="background:var(--chip);color:var(--ink)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18 9 12l6-6"/></svg>
        </button>
        <div class="flex items-center gap-1.5">
          <button onclick="fontStep(-1)" class="h-9 px-3 rounded-full text-[13px] font-bold" style="background:var(--chip);color:var(--ink)">A−</button>
          <button onclick="fontStep(1)" class="h-9 px-3 rounded-full text-[15px] font-bold" style="background:var(--chip);color:var(--ink)">A+</button>
          <button id="rBookmark" onclick="toggleSaveCurrent()" class="w-9 h-9 rounded-full flex items-center justify-center" style="background:var(--chip);color:var(--ink)"></button>
          <button onclick="share()" class="w-9 h-9 rounded-full flex items-center justify-center" style="background:var(--chip);color:var(--ink)">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13"/><path d="m7.5 7.5 4.5-4.5 4.5 4.5"/><path d="M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg>
          </button>
        </div>
      </div>
      <div class="scroll px-5 pb-8" id="readerBody"></div>
    </section>

    <div class="toast" id="toast"></div>
  </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
